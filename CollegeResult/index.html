<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Al Parvez Girls Degree College - Result Portal</title>
  <style>
    :root {
      --primary: #800020;
      --primary-dark: #5c0017;
      --accent: #D4AF37;
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #212529;
      --border-color: #dee2e6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      text-align: center;
      padding: 2.5rem 1rem;
      border-bottom: 4px solid var(--accent);
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    header h1 {
      font-size: 2.2rem;
      margin-bottom: 0.5rem;
      letter-spacing: 0.5px;
    }

    header p {
      font-size: 1.1rem;
      opacity: 0.9;
    }

    .container {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1rem;
      width: 100%;
      flex: 1;
    }

    .search-card {
      background: var(--card-bg);
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      margin-bottom: 2rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 1.25rem;
    }

    .form-group {
      display: flex;
      flex-direction: column;
    }

    .form-group label {
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: var(--primary-dark);
      font-size: 0.95rem;
    }

    .form-group input, .form-group select {
      padding: 0.75rem 1rem;
      border: 1.5px solid var(--border-color);
      border-radius: 6px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(128, 0, 32, 0.15);
    }

    .btn-search {
      grid-column: 1 / -1;
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0.9rem;
      font-size: 1.05rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 0.5rem;
    }

    .btn-search:hover {
      background-color: var(--primary-dark);
    }

    .result-section {
      display: none;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .btn-download {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background-color: #27ae60;
      color: white;
      text-decoration: none;
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      font-weight: 600;
      transition: background-color 0.2s;
    }

    .btn-download:hover {
      background-color: #219150;
    }

    .pdf-preview-box {
      width: 100%;
      height: 600px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      overflow: hidden;
      background-color: #f1f3f5;
    }

    .pdf-preview-box iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    .status-msg {
      padding: 1rem;
      border-radius: 6px;
      margin-bottom: 1rem;
      display: none;
    }

    .status-msg.info {
      background-color: #e7f5ff;
      color: #1864ab;
      border: 1px solid #74c0fc;
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      background-color: #1a1a1a;
      color: #aaa;
      font-size: 0.9rem;
      margin-top: auto;
    }
  </style>
</head>
<body>

  <header>
    <h1>Al Parvez Girls Degree College</h1>
    <p>Official Student Examination Result Portal</p>
  </header>

  <div class="container">
    <div class="search-card">
      <form id="resultForm">
        <div class="form-grid">
          
          <div class="form-group">
            <label for="enrollment">Enrollment / Roll Number</label>
            <input type="text" id="enrollment" placeholder="e.g. AP2026101" required>
          </div>

          <div class="form-group">
            <label for="course">Select Course</label>
            <select id="course" required>
              <option value="BA">BA (Bachelor of Arts)</option>
              <option value="BSC">BSC (Bachelor of Science)</option>
            </select>
          </div>

          <div class="form-group">
            <label for="semester">Select Semester</label>
            <select id="semester" required>
              <option value="Semester_1">Semester 1</option>
              <option value="Semester_2">Semester 2</option>
              <option value="Semester_3">Semester 3</option>
              <option value="Semester_4">Semester 4</option>
              <option value="Semester_5">Semester 5</option>
              <option value="Semester_6">Semester 6</option>
            </select>
          </div>

          <button type="submit" class="btn-search">Search Result</button>
        </div>
      </form>
    </div>

    <div id="statusMsg" class="status-msg info"></div>

    <div id="resultSection" class="result-section">
      <div class="result-header">
        <div>
          <h2 id="studentTitle">Result Details</h2>
          <p id="studentSub" style="color: #666; font-size: 0.95rem; margin-top: 4px;"></p>
        </div>
        <a id="downloadBtn" href="#" download class="btn-download">
          📥 Download PDF
        </a>
      </div>

      <div class="pdf-preview-box">
        <iframe id="pdfFrame" src=""></iframe>
      </div>
    </div>
  </div>

  <footer>
    &copy; Al Parvez Girls Degree College. Hosted on GitHub Pages.
  </footer>

  <script>
    document.getElementById('resultForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const enrollment = document.getElementById('enrollment').value.trim().toUpperCase();
      const course = document.getElementById('course').value;
      const semester = document.getElementById('semester').value;
      const semFormatted = semester.replace('_', ' ');

      // Updated Search Path: results/[Course]/[Semester]/[EnrollmentNo].pdf
      const fileName = `${enrollment}.pdf`;
      const filePath = `results/${course}/${semester}/${fileName}`;

      const resultSection = document.getElementById('resultSection');
      const pdfFrame = document.getElementById('pdfFrame');
      const downloadBtn = document.getElementById('downloadBtn');
      const studentTitle = document.getElementById('studentTitle');
      const studentSub = document.getElementById('studentSub');
      const statusMsg = document.getElementById('statusMsg');

      // Header info update
      studentTitle.innerText = `Enrollment No: ${enrollment}`;
      studentSub.innerText = `Course: ${course} | ${semFormatted}`;

      // Set PDF path for preview and download
      pdfFrame.src = filePath;
      downloadBtn.href = filePath;
      downloadBtn.setAttribute('download', `${enrollment}_${course}_${semester}.pdf`);

      // Display result view
      resultSection.style.display = 'block';

      // Status indicator
      statusMsg.style.display = 'block';
      statusMsg.innerHTML = `Searching file at: <code>${filePath}</code>`;

      // Smooth scrolling
      resultSection.scrollIntoView({ behavior: 'smooth' });
    });
  </script>
</body>
</html>
